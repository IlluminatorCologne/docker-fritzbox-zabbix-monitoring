name: Build and Push Docker Image

on:
  push:
    branches: [main, v2]
    tags: ['v*']
  pull_request:
    branches: [main, v2]

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  DOCKERHUB_ORG: illuminatorcologne
  GITHUB_ORG: illuminatorcologne
  DOCKER_BUILDKIT: 1
  DOCKER_CLI_EXPERIMENTAL: enabled
  DOCKER_DEFAULT_PLATFORM: linux/amd64
  DOCKER_CLI_ASL: true
  IMAGE_NAME: fritzbox-zabbix-monitoring
  IMAGE_TAG_DOCKER: docker.io/illuminatorcologne/fritzbox-zabbix-monitoring:latest
  IMAGE_TAG_GHCR: ghcr.io/illuminatorcologne/fritzbox-zabbix-monitoring:latest

permissions:
  contents: read
  packages: write
  pull-requests: write
  issues: write

jobs:
  build:
    name: Release, Build and Push Docker Image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
    steps:
      # —— Setup Environment actions  ——————————————————————————————————————————————
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          # Use secrets for Docker Hub credentials
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # Use GitHub token for authentication
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # —— Build latest images  ——————————————————————————————————————————————
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ matrix.platform }}
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max  
          tags: |
            ${{ env.IMAGE_TAG_DOCKER }}
            ${{ env.IMAGE_TAG_GHCR }}